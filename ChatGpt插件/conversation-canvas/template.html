<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>对话便笺画布</title>
<style>
:root{font-family:system-ui,'Microsoft YaHei',sans-serif;color-scheme:light dark;--bg:#f4f7fb;--paper:#fff;--ink:#24334a;--muted:#64748b;--line:#dfe6f0;--blue:#376cd6;--soft:#eef4ff;--green:#18865a;--purple:#8a64c2;--input:#fff}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--bg);overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);color:var(--ink);font-size:12px}button:hover{border-color:var(--blue)}button:disabled{opacity:.5;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}[hidden]{display:none!important}
.app{height:100dvh;display:flex;flex-direction:column;min-height:0}.toolbar{flex:none;background:var(--paper);padding:12px 16px 8px;border-bottom:1px solid var(--line)}.top,.tools,.searchbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.top{margin-bottom:9px}.brand{font-weight:750;font-size:15px;margin-right:auto}.brand small{font-size:10px;color:var(--muted);font-weight:500;margin-left:7px}.active{background:var(--soft);color:var(--blue);border-color:var(--blue)}.tools input{accent-color:var(--blue);width:90px}.tools output{width:38px;font-size:11px;color:var(--muted)}.searchbar{margin-top:8px}.searchbar input{flex:1;min-width:120px;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:8px;padding:7px 10px;font-size:12px}.searchbar span{font-size:11px;color:var(--muted);min-width:38px}.meta{padding:7px 16px;display:flex;gap:10px;color:var(--muted);font-size:11px;flex:none;align-items:center}.meta #title{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}.legend{white-space:nowrap}.legend b{color:var(--blue)}.legend i{color:var(--purple);font-style:normal}
.workspace{position:relative;flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;background-image:radial-gradient(#cdd8e6 .7px,transparent .7px);background-size:20px 20px;touch-action:pan-x pan-y}.space{position:relative}.canvas{position:absolute;left:0;top:0;transform-origin:0 0}.edges{position:absolute;inset:0;overflow:visible;pointer-events:none}.edge{fill:none;stroke:#8298b8;stroke-width:2}.edge.branch{stroke:var(--purple);stroke-dasharray:6 5}.edge.focused{stroke:var(--blue);stroke-width:3}.note{position:absolute;width:360px;height:408px;display:flex;flex-direction:column;border:1px solid var(--line);border-top:3px solid var(--blue);border-radius:12px;background:var(--paper);box-shadow:0 4px 14px #1935540c;overflow:hidden}.note.branch{border-top-color:var(--purple)}.note.selected{outline:2px solid var(--blue);outline-offset:2px}.note.match{box-shadow:0 0 0 3px #e6ac3855}.note-top{display:flex;align-items:center;gap:8px;padding:10px 12px 5px;cursor:grab;touch-action:none;user-select:none;font-size:12px;font-weight:700}.node-label{color:var(--blue);white-space:nowrap}.kind{margin-left:auto;color:var(--muted);font-size:10px;font-weight:500}.note-tools{display:flex;gap:5px;padding:3px 10px 6px}.note-tools button{font-size:10px;padding:3px 6px}.node-text{font-size:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;user-select:text;cursor:text;scrollbar-width:thin;overscroll-behavior:contain;padding:0 12px}.question-text{flex:none;height:67px;font-weight:600}.answer-label{font-size:10px;color:var(--green);margin:7px 12px 5px;padding-top:6px;border-top:1px solid var(--line);flex:none}.answer-text{flex:1;min-height:36px}.composer{padding:8px 10px 10px;flex:none}.composer textarea{width:100%;height:44px;resize:none;border:1px solid var(--line);background:var(--input);color:var(--ink);border-radius:8px;padding:6px 8px;font-size:12px;display:block}.composer .actions{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}.composer button{font-size:11px;padding:4px 8px}.quote{display:flex;gap:5px;align-items:center;font-size:10px;color:var(--purple);height:24px}.quote span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.quote button{padding:0 5px}.list-view{padding:14px;display:grid;gap:14px}.list-view .note{position:relative;width:100%;max-width:920px;height:auto;min-height:360px;margin:auto;left:auto!important;top:auto!important}.list-view .question-text{height:auto;max-height:130px}.list-view .answer-text{max-height:260px;min-height:80px}.empty{padding:70px 24px;text-align:center;color:var(--muted);font-size:14px}.status{padding:7px 16px;min-height:30px;flex:none;font-size:11px;color:var(--muted);background:var(--paper);border-top:1px solid var(--line)}.selection{position:fixed;z-index:10;box-shadow:0 4px 16px #23385c30;background:var(--blue);color:white;border-radius:8px;padding:7px 12px;font-size:12px;max-width:90vw}mark{background:#ffe5a0;color:#3a2e11;border-radius:2px}
dialog{max-width:min(600px,94vw);width:540px;max-height:88vh;border:1px solid var(--line);border-radius:16px;background:var(--paper);color:var(--ink);padding:20px}dialog::backdrop{background:#10243b55}dialog h2{font-size:18px;margin:0 0 8px}dialog p{font-size:12px;line-height:1.6;color:var(--muted)}dialog label{display:block;font-size:12px;margin:12px 0 5px}dialog select,dialog textarea{width:100%;background:var(--input);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px}dialog textarea{height:250px;font:12px/1.5 ui-monospace,monospace;white-space:pre}dialog footer{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
@media(max-width:640px){.toolbar{padding:9px}.legend{display:none}.tools{gap:5px}.tools button{padding:5px 7px}.brand{font-size:13px}.meta{padding:6px 9px}}
@media(prefers-color-scheme:dark){:root{--bg:#111a28;--paper:#1b283b;--ink:#e2eaf5;--muted:#9eafc7;--line:#34465e;--blue:#82aaff;--soft:#273e65;--green:#81d5ac;--purple:#c1a0ee;--input:#152033}.primary{background:#376cd6;color:white;border-color:#376cd6}.workspace{background-image:radial-gradient(#34465e .7px,transparent .7px)}}
</style></head><body><main class="app">
<header class="toolbar"><div class="top"><div class="brand">✣ 对话便笺画布 <small>0.5</small></div><button id="tree-view" class="active">树状图</button><button id="list-view">阅读列表</button><button id="export">导出</button></div>
<div class="tools"><button id="fit">适应画布</button><button id="latest">定位最新</button><button id="expand">展开全部</button><button id="arrange">自动整理</button><button id="undo" disabled>撤销关系修改</button><input id="zoom" type="range" min="10" max="170" value="85" aria-label="画布缩放"><output id="zoom-value">85%</output></div>
<div class="searchbar"><input id="search" type="search" placeholder="搜索问题和完整回答…" aria-label="搜索问答"><span id="search-count">0 项</span><button id="previous-match" aria-label="上一项搜索结果">↑</button><button id="next-match" aria-label="下一项搜索结果">↓</button></div></header>
<div class="meta"><span id="count">0 个问题</span><span id="title">等待对话内容</span><span class="legend"><b>━ 主线</b>　<i>┄ 分支</i></span></div>
<section class="workspace" aria-label="问答画布"><div class="space"><div class="canvas"></div></div></section>
<div id="status" class="status" role="status" aria-live="polite">拖动空白区域平移；拖动卡片标题调整位置。</div>
</main><button id="quote-action" class="selection" hidden>引用选中文字追问</button>
<dialog id="relation-dialog"><h2>调整问题关系</h2><p id="relation-description"></p><label for="relation-kind">问题类型</label><select id="relation-kind"><option value="main">主线延续</option><option value="branch">从某个问题分支</option></select><label for="relation-parent">来源问题</label><select id="relation-parent"></select><p>只改变画布关系。原始对话和 ChatGPT 原生分支不会改变。</p><footer><button id="relation-reset">恢复自动判断</button><button id="relation-cancel">取消</button><button id="relation-save" class="primary">保存关系</button></footer></dialog>
<dialog id="export-dialog"><h2 id="export-title">导出对话</h2><p id="export-description">仅导出本次传入的对话内容，不包含未发送的追问。</p><select id="export-format" aria-label="导出格式"><option value="md">Markdown 文档</option><option value="json">JSON 内容和关系</option></select><textarea id="export-content" aria-label="导出内容" readonly></textarea><footer><button id="export-close">关闭</button><button id="export-copy">复制内容</button><button id="export-download" class="primary">下载文件</button></footer></dialog>
<script type="module">/*__BUNDLE__*/</script></body></html>
